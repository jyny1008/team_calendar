<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중등교육 캘린더 - 관리자</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 로그인 게이트 -->
  <div class="login-gate no-print" id="loginGate">
    <h1>관리자페이지</h1>
    <p>비밀번호를 입력하세요.</p>
    <form id="loginForm">
      <input type="password" id="loginPassword" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="••••">
      <div class="error" id="loginError"></div>
      <button type="submit" class="btn primary" style="width:100%;">로그인</button>
    </form>
    <p class="hint"><a href="index.html">← 캘린더로 돌아가기</a></p>
  </div>

  <!-- 관리자 본문 -->
  <div class="app-shell hidden no-print" id="adminShell">
    <header class="app-header">
      <div class="app-title">중등교육 캘린더 <span class="badge">관리자</span></div>
      <div class="header-actions">
        <a class="btn ghost" href="index.html">캘린더 보기</a>
        <button class="btn ghost" id="logoutBtn">로그아웃</button>
      </div>
    </header>

    <section class="section-card">
      <h2>📅 대상 월 &amp; 내보내기</h2>
      <div class="month-nav" style="margin-bottom:12px;">
        <button class="icon-btn" id="adminPrevBtn" aria-label="이전 달">‹</button>
        <div class="month-label" id="adminMonthLabel">-</div>
        <button class="icon-btn" id="adminNextBtn" aria-label="다음 달">›</button>
      </div>
      <div class="filter-group">
        <button class="btn" id="exportPdfBtn">🖨️ PDF로 인쇄/저장</button>
        <button class="btn" id="exportExcelBtn">📊 엑셀 다운로드</button>
        <button class="btn" id="exportOfflineBtn">💾 오프라인 HTML 생성</button>
      </div>
      <p class="hint">선택한 월의 일정을 기준으로 내보냅니다. PDF는 브라우저 인쇄 대화상자에서 "PDF로 저장"을 선택하세요.</p>
    </section>

    <section class="section-card">
      <h2 id="formTitle">➕ 일정 등록</h2>
      <form id="eventForm">
        <input type="hidden" id="eventRow">
        <div class="form-grid">
          <div class="field">
            <label for="fStartDate">시작일 *</label>
            <input type="date" id="fStartDate" required>
          </div>
          <div class="field">
            <label for="fStartTime">시작시간 (생략가능)</label>
            <input type="time" id="fStartTime">
          </div>
          <div class="field">
            <label for="fEndDate">종료일 (당일 행사는 비워두세요)</label>
            <input type="date" id="fEndDate">
          </div>
          <div class="field">
            <label for="fEndTime">종료시간 (생략가능)</label>
            <input type="time" id="fEndTime">
          </div>
          <div class="field full">
            <label for="fTitle">행사명 *</label>
            <input type="text" id="fTitle" required>
          </div>
          <div class="field">
            <label for="fLocation">장소</label>
            <input type="text" id="fLocation">
          </div>
          <div class="field">
            <label for="fOrg">주관 *</label>
            <input type="text" id="fOrg" list="orgOptions" required>
            <datalist id="orgOptions">
              <option value="중등교육">
              <option value="직업교육">
              <option value="중등인사">
              <option value="진로진학">
            </datalist>
          </div>
          <div class="field full">
            <label for="fAudience">참가대상</label>
            <input type="text" id="fAudience">
          </div>
          <div class="field">
            <label for="fManager">담당자</label>
            <input type="text" id="fManager">
          </div>
          <div class="field">
            <label>공개여부</label>
            <div class="radio-row">
              <label><input type="radio" name="fVisibility" value="공개" checked> 공개</label>
              <label><input type="radio" name="fVisibility" value="비공개"> 비공개</label>
            </div>
          </div>
          <div class="field">
            <label for="fColor">색상</label>
            <div class="color-field">
              <input type="checkbox" id="fColorDefault" checked>
              <span style="font-size:12.5px;">주관 기본색 사용</span>
              <input type="color" id="fColor" value="#5e81ac" disabled>
            </div>
          </div>
          <div class="field full">
            <label for="fNote">비고</label>
            <textarea id="fNote"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn ghost" id="resetFormBtn">초기화</button>
          <button type="submit" class="btn primary" id="submitBtn">등록</button>
        </div>
      </form>
    </section>

    <section class="section-card">
      <div class="section-head">
        <h2>🗂️ <span id="tableMonthLabel">-</span> 일정 목록</h2>
        <div class="section-nav">
          <button class="icon-btn small" id="tablePrevBtn" aria-label="이전 달">‹</button>
          <button class="icon-btn small" id="tableNextBtn" aria-label="다음 달">›</button>
          <button class="btn small" id="tablePdfBtn">🖨️ 표 PDF</button>
          <button class="btn small" id="tableExcelBtn">📊 표 엑셀</button>
        </div>
      </div>
      <div class="admin-table-wrap">
        <div class="admin-table-scroll">
          <table class="admin-table">
            <thead>
              <tr>
                <th>기간</th><th>주관</th><th>행사명</th><th>장소</th><th>담당자</th><th>공개여부</th><th></th>
              </tr>
            </thead>
            <tbody id="eventTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="section-card">
      <h2>🔑 비밀번호 변경</h2>
      <div class="form-grid">
        <form id="adminPwForm" class="field full" style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
          <div class="field" style="flex:1; min-width:160px;">
            <label for="newAdminPw">관리자페이지 비밀번호 변경</label>
            <input type="password" id="newAdminPw" autocomplete="off" placeholder="새 비밀번호">
          </div>
          <button type="submit" class="btn">변경</button>
        </form>
        <form id="privatePwForm" class="field full" style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
          <div class="field" style="flex:1; min-width:160px;">
            <label for="newPrivatePw">비공개 일정 확인 비밀번호 변경</label>
            <input type="password" id="newPrivatePw" autocomplete="off" placeholder="새 비밀번호">
          </div>
          <button type="submit" class="btn">변경</button>
        </form>
      </div>
    </section>
  </div>

  <div class="print-only" id="printCalendar"></div>

  <div class="loading-overlay hidden" id="loadingOverlay">처리 중...</div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/export.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
